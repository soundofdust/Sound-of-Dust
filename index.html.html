<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sound of Dust</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Amiri&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#f6f1e9;--card:#fffdf8;--ink:#2b2622;--mute:#7a6f63;--acc:#a8793f;--line:#e4dbcc;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1916;--card:#25211d;--ink:#ece4d8;--mute:#a49a8c;--acc:#d3a566;--line:#3a342d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1916;--card:#25211d;--ink:#ece4d8;--mute:#a49a8c;--acc:#d3a566;--line:#3a342d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 Lora,Georgia,serif}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
header{padding:36px 0 20px;text-align:center}
.ar{font:34px Amiri,'Traditional Arabic',serif;color:var(--acc);margin:0}
.logo{font-size:30px;font-weight:600;letter-spacing:.5px;margin:2px 0;text-decoration:none;color:var(--ink);display:block}
.tag{color:var(--mute);font-style:italic;margin:4px 0 0;font-size:15px}
nav{display:flex;justify-content:center;gap:22px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:500 14px Inter,system-ui,sans-serif}
nav a{color:var(--mute);text-decoration:none;padding:4px 0}
nav a.on{color:var(--acc);border-bottom:2px solid var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 0 6px;font:500 13px Inter,system-ui,sans-serif}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);padding:6px 14px;border-radius:99px;white-space:nowrap;cursor:pointer;font:inherit}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.post{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0;text-decoration:none;color:inherit}
.meta{font:500 12px Inter,system-ui,sans-serif;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
.post h2{font-size:21px;line-height:1.35;margin:6px 0}
.post p{margin:0;color:var(--mute);font-size:15px}
article h1{font-size:28px;line-height:1.3;margin:28px 0 6px}
article p{margin:0 0 1.1em}
.back{display:inline-block;margin-top:22px;font:500 14px Inter,system-ui,sans-serif;color:var(--acc);text-decoration:none}
.note{font:13px Inter,system-ui,sans-serif;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:18px 0}
.about h1{font-size:26px;margin:28px 0 4px}
.about .ar{text-align:center;margin-bottom:18px}
.end{font-style:italic;color:var(--acc);border-left:3px solid var(--acc);padding-left:14px;margin-top:26px}
footer{text-align:center;color:var(--mute);font:13px Inter,system-ui,sans-serif;padding:40px 0 30px}
</style>
</head>
<body>
<div class="wrap">
<header>
<p class="ar">صوت التراب</p>
<a class="logo" href="#home">Sound of Dust</a>
<p class="tag">Kecil, tapi tak luput dari udara.</p>
</header>
<nav><a href="#home" id="n-home">Tulisan</a><a href="#tentang" id="n-tentang">Tentang</a></nav>
<main id="app"></main>
<footer>© <span id="yr"></span> Sound of Dust · Shawt at-Turab<br>Yang kecil pun punya suara.</footer>
</div>
<script>
// === EDIT DI SINI: ganti contoh tulisan dengan tulisanmu sendiri ===
var POSTS=[
{id:"tulisan-1",cat:"Negara",date:"2026-11-19",title:"Contoh: Warga Biasa dan Hak untuk Bertanya",
body:["Ini hanya contoh tulisan. Ganti judul, kategori, tanggal, dan isi di bagian POSTS pada kode.","Setiap paragraf adalah satu item di dalam daftar body. Tulis kritikmu dengan data, dengan hati, dan terbuka untuk dikoreksi."]},
{id:"tulisan-2",cat:"Hukum",date:"2026-11-18",title:"Contoh: Hukum yang Terasa Jauh dari Rakyat Kecil",
body:["Tulisan contoh kedua. Hapus atau ubah sesukamu.","Sertakan sumber agar pembaca bisa memeriksa sendiri."]},
{id:"tulisan-3",cat:"Agama",date:"2026-11-17",title:"Contoh: Beragama dengan Akal dan Rasa",
body:["Tulisan contoh ketiga tentang agama.","Kritiklah gagasan, bukan pribadi."]},
{id:"tulisan-4",cat:"Ormas",date:"2026-11-16",title:"Contoh: Ormas dan Tanggung Jawab kepada Publik",
body:["Tulisan contoh keempat tentang ormas.","Debu kecil, tapi bisa membuat orang berhenti sejenak dan melihat sekitar."]}
];
var CATS=["Semua","Negara","Hukum","Agama","Ormas","Lainnya"];
var cat="Semua",app=document.getElementById("app");
document.getElementById("yr").textContent=new Date().getFullYear();
function fmt(d){try{return new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function home(){
var h='<div class="chips">'+CATS.map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+c+'">'+c+'</button>'}).join("")+'</div>';
var list=POSTS.filter(function(p){return cat==="Semua"||p.cat===cat});
h+=list.length?list.map(function(p){return '<a class="post" href="#'+p.id+'"><div class="meta">'+p.cat+' · '+fmt(p.date)+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.body[0])+'</p></a>'}).join(""):'<p class="note">Belum ada tulisan di kategori ini.</p>';
app.innerHTML=h;
app.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){cat=b.dataset.c;home()}});
}
function about(){
app.innerHTML='<section class="about"><h1>Tentang Sound of Dust</h1><p class="ar">صوت التراب</p>'+
'<p>Debu sering dianggap tak penting. Mudah disapu, mudah diabaikan, kadang dianggap mengganggu.</p>'+
'<p>Padahal dalam Islam, debu bukan sekadar kotoran. Ia alat bersuci. Ketika air tak ada, tanah yang bersih menggantikan peran air untuk menyucikan. Yang tampak remeh ternyata punya kehormatan. Dan kehadirannya jadi bukti bahwa kehidupan sedang berjalan.</p>'+
'<p>Sound of Dust lahir dari keyakinan itu: bahwa suara yang kecil pun layak didengar.</p>'+
'<p>Ini adalah ruang untuk kritik dan opini tentang apa saja yang menyentuh hidup bersama: negara, hukum, agama, ormas, dan hal-hal lain yang sering dibicarakan pelan-pelan atau dibiarkan berlalu. Wadah ini ada bukan untuk membenci, melainkan karena peduli. Bukan untuk menyerang pribadi, melainkan untuk menguji gagasan dan kebijakan.</p>'+
'<p>Penulisnya bukan tokoh, bukan akademisi, hanya warga biasa yang percaya bahwa tak perlu jadi siapa-siapa untuk berani bertanya, dan tak perlu jadi besar untuk bermanfaat. Seperti debu, tulisan di sini mungkin terlihat remeh. Tapi semoga ia membuat orang berhenti sejenak, mengucek mata, lalu mulai memperhatikan sekitar dengan lebih jernih.</p>'+
'<p>Tulisan di sini berusaha berpijak pada data, disampaikan dengan hati, dan terbuka untuk dikoreksi.</p>'+
'<p class="end">Karena yang kecil pun punya suara. Dan kadang, debulah yang membuat kita menyadari bahwa dunia sedang bergerak.</p></section>';
}
function post(p){
app.innerHTML='<article><a class="back" href="#home">← Semua tulisan</a><h1>'+esc(p.title)+'</h1><div class="meta">'+p.cat+' · '+fmt(p.date)+'</div><div style="height:18px"></div>'+p.body.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")+'<a class="back" href="#home">← Kembali</a></article>';
}
function route(){
var h=(location.hash||"#home").slice(1),p=POSTS.filter(function(x){return x.id===h})[0];
document.getElementById("n-home").className=(h==="tentang")?"":"on";
document.getElementById("n-tentang").className=(h==="tentang")?"on":"";
if(h==="tentang")about();else if(p)post(p);else home();
window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
